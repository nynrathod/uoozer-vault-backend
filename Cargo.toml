[package]
name = "uoozer-vault-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart", "tokio"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = [
	"cors",
	"trace",
	"compression-gzip",
	"request-id",
	"util",
	"catch-panic",
	"sensitive-headers",
] }
hyper = "1.11"
http = "1.4"

# Database
sqlx = { version = "0.9", default-features = false, features = [
	"runtime-tokio",
	"tls-rustls",
	"postgres",
	"uuid",
	"chrono",
	"json",
	"macros",
	"migrate",
	"ipnetwork",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
	"env-filter",
	"json",
	"fmt",
	"chrono",
] }

# Crypto
argon2 = "0.5"
bcrypt = "0.19"
rand = { version = "0.10", features = ["std_rng"] }
zeroize = { version = "1.9", features = ["derive"] }
blake3 = "1.8"
subtle = "2.6"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
hex = "0.4"
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem", "rand_core"] }
pkcs8 = { version = "0.11", features = ["std", "alloc"] }
spki = { version = "0.7", features = ["pem"] }
jsonwebtoken = { version = "10.4", default-features = false, features = [
	"rust_crypto",
] }
# Object storage
aws-config = { version = "1.10", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.139"

# Utilities
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"
dotenvy = "0.15"
validator = { version = "0.20", features = ["derive"] }
dashmap = "6.2"
governor = "0.10"
figment = { version = "0.10", features = ["env", "toml"] }
async-trait = "0.1"
futures-util = "0.3"
tokio-stream = "0.1"

# OpenAPI / Swagger
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

async-stream = "0.3"

[dev-dependencies]
# HTTP test client
axum-test = "16"
reqwest = { version = "0.13", default-features = false, features = [
	"json",
	"rustls",
	"multipart",
] }
tokio = { version = "1.53", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

# Property-based testing
proptest = "1.6"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Fakes + fixtures
fake = { version = "4.3", features = ["derive"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

# Assertions
pretty_assertions = "1.4"
assert_matches = "1.5"

# Snapshot testing
insta = { version = "1.43", features = ["json", "redactions"] }

# Testcontainers (optional, for CI)
testcontainers = "0.24"

dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
